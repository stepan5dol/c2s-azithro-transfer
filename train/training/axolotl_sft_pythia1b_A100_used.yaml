# Full fine-tuning of vandijklab/C2S-Scale-Pythia-1b-pt (GPT-NeoX, 1B) on
# pipeline_short/sft_dataset_bidir in the axolotl input_output format
# (build_axolotl_segments.py): 14,520 train / 102 valid / 1,566 test examples.
# Prompt segments are masked from the loss, completion segments are trained.

base_model: vandijklab/C2S-Scale-Pythia-1b-pt
model_type: AutoModelForCausalLM
tokenizer_type: AutoTokenizer
trust_remote_code: false

# full fine-tuning, no adapter
adapter:
load_in_8bit: false
load_in_4bit: false
strict: false

datasets:
  - path: /workspace/axolotl/mainwork/dataset/train_segments.jsonl
    type: input_output
    ds_type: json

test_datasets:
  - path: /workspace/axolotl/mainwork/dataset/valid_segments.jsonl
    type: input_output
    ds_type: json
    split: train

val_set_size: 0
output_dir: /workspace/axolotl/mainwork/sft_pythia1b_short_full

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true
eval_sample_packing: false

flash_attention: true

gradient_checkpointing: true
bf16: true
tf32: true

micro_batch_size: 4
gradient_accumulation_steps: 16   # effective batch 64
num_epochs: 6   # upper bound; early stopping sets the stop point

optimizer: adamw_bnb_8bit
lr_scheduler: cosine
learning_rate: 1e-4
warmup_ratio: 0.1
max_grad_norm: 1.0
weight_decay: 0.0

logging_steps: 1
eval_steps: 33
save_steps: 33
save_total_limit: 5
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
early_stopping_patience: 4

special_tokens:
  pad_token: "<|endoftext|>"

seed: 42

wandb_project:
use_tensorboard: true
